databases:
  - name: esm-postgres
    plan: free
    databaseName: employee_salary_db
    user: esm_admin

services:
  - type: web
    name: esm-backend
    runtime: node
    plan: free
    branch: develop
    buildCommand: npm install --include=dev --workspace=backend && npm run build --workspace=backend
    startCommand: npm run start --workspace=backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: esm-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
